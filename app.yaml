name: motivation-machine
app_id: da_nP7IptBU9BLO
owner: baalimago
package: .
capabilities:
  database:
    engine: postgres
volumes:
- name: blessings
  mount: /data/blessings
# NOTE: the daily job is deliberately NOT defined here. Config-sourced jobs
# can't carry the auth header without committing the token to the repo, and
# they can't be edited via API/GUI. The job lives as an API-sourced cronjob
# ("daily-trash-blessing-authed", created via the createCronJob GraphQL
# mutation) with the X-Api-Key header attached. See whitepaper/skill.md.
kind: wasmer.io/App.v0
annotations:
  anybuild.run/config:
    commands:
      start: node server/index.js
    edgejs_enable: true
    edgejs_precompile: true
    name: out
    node_install_inputs:
    - package.json
    node_package_manager: npm
    node_package_name: motivational-raccoon-and-friends
    node_remove_native_binaries: true
    node_server: express
  anybuild.run/provider: node
  anybuild.run/version: 0.27.2
  wasmer.io/version: 7.2.1
enableDatabase: true
